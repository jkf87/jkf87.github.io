<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI-first design workflow</title>
<desc id="desc">A newsletter style diagram showing a designer speaking to coding agents, generating websites, shaders, machine-readable pages, and event branding.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#312e81"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.42"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#glow)"/><rect width="1600" height="900" fill="url(#grid)"/>
<g filter="url(#shadow)">
  <rect x="115" y="130" width="430" height="620" rx="34" fill="#f8fafc"/>
  <text x="155" y="190" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="800" fill="#111827">DESIGNER</text>
  <text x="155" y="235" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="24" fill="#475569">voice → agent → artifact</text>
  <rect x="155" y="285" width="350" height="92" rx="22" fill="#eef2ff"/>
  <text x="183" y="322" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Aqua</text>
  <text x="183" y="354" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">stream of consciousness</text>
  <rect x="155" y="405" width="350" height="92" rx="22" fill="#f5f3ff"/>
  <text x="183" y="442" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Conductor / Claude</text>
  <text x="183" y="474" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">one-shot 16 variations</text>
  <rect x="155" y="525" width="350" height="92" rx="22" fill="#ecfeff"/>
  <text x="183" y="562" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700" fill="#0e7490">Paper Design</text>
  <text x="183" y="594" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">shaders as knobs</text>
</g>
<g stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" opacity="0.9"><path d="M575 310 C705 230 735 230 870 310" fill="none"/><path d="M575 450 C710 450 735 450 870 450" fill="none"/><path d="M575 590 C705 670 735 670 870 590" fill="none"/></g>
<g filter="url(#shadow)">
  <rect x="900" y="105" width="585" height="690" rx="40" fill="#111827" stroke="#c4b5fd" stroke-opacity="0.35"/>
  <text x="950" y="170" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="900" fill="#fff">AI-FIRST DESIGN</text>
  <text x="950" y="214" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#cbd5e1">software is editable material</text>
  <rect x="950" y="265" width="225" height="145" rx="24" fill="#312e81"/><text x="982" y="318" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">Paxel</text><text x="982" y="354" font-family="Inter, sans-serif" font-size="18" fill="#ddd6fe">Wrapped for coding</text>
  <rect x="1210" y="265" width="225" height="145" rx="24" fill="#4c1d95"/><text x="1242" y="318" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">SOTA Zine</text><text x="1242" y="354" font-family="Inter, sans-serif" font-size="18" fill="#ddd6fe">soul.md as source</text>
  <rect x="950" y="450" width="225" height="145" rx="24" fill="#164e63"/><text x="982" y="503" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">Machine page</text><text x="982" y="539" font-family="Inter, sans-serif" font-size="18" fill="#cffafe">for agents, not eyes</text>
  <rect x="1210" y="450" width="225" height="145" rx="24" fill="#065f46"/><text x="1242" y="503" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">Startup School</text><text x="1242" y="539" font-family="Inter, sans-serif" font-size="18" fill="#d1fae5">brand system as tool</text>
  <rect x="950" y="645" width="485" height="78" rx="22" fill="#f8fafc"/><text x="982" y="694" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#111827">The bottleneck is imagination.</text>
</g>
<text x="115" y="825" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#cbd5e1">Based on Y Combinator Design Review: “YC’s Head of Design Shows You How To Design With AI”</text>
</svg>