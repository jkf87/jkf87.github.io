<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="155" r="280" fill="#38bdf8" opacity="0.08"/>
  <circle cx="260" cy="760" r="330" fill="#a78bfa" opacity="0.08"/>
  <text x="100" y="115" fill="#e5e7eb" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="54" font-weight="800">RL Environments for LLM Agents</text>
  <text x="102" y="162" fill="#93c5fd" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="26">E = { T, H, V, S, C }</text>
  <g filter="url(#shadow)" font-family="Inter, Apple SD Gothic Neo, sans-serif">
    <rect x="120" y="300" width="220" height="130" rx="28" fill="#f8fafc"/>
    <text x="230" y="355" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="800">T</text>
    <text x="230" y="392" text-anchor="middle" fill="#334155" font-size="22">Tasks</text>
    <text x="230" y="420" text-anchor="middle" fill="#64748b" font-size="17">what to solve</text>

    <rect x="430" y="300" width="220" height="130" rx="28" fill="#f8fafc"/>
    <text x="540" y="355" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="800">H</text>
    <text x="540" y="392" text-anchor="middle" fill="#334155" font-size="22">Harness</text>
    <text x="540" y="420" text-anchor="middle" fill="#64748b" font-size="17">tools &amp; loop</text>

    <rect x="740" y="300" width="220" height="130" rx="28" fill="#f8fafc"/>
    <text x="850" y="355" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="800">V</text>
    <text x="850" y="392" text-anchor="middle" fill="#334155" font-size="22">Verifier</text>
    <text x="850" y="420" text-anchor="middle" fill="#64748b" font-size="17">what counts as good</text>

    <rect x="1050" y="300" width="220" height="130" rx="28" fill="#f8fafc"/>
    <text x="1160" y="355" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="800">S</text>
    <text x="1160" y="392" text-anchor="middle" fill="#334155" font-size="22">State</text>
    <text x="1160" y="420" text-anchor="middle" fill="#64748b" font-size="17">memory &amp; world</text>

    <rect x="1270" y="520" width="220" height="130" rx="28" fill="#f8fafc"/>
    <text x="1380" y="575" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="800">C</text>
    <text x="1380" y="612" text-anchor="middle" fill="#334155" font-size="22">Config</text>
    <text x="1380" y="640" text-anchor="middle" fill="#64748b" font-size="17">limits &amp; curriculum</text>
  </g>
  <path d="M340 365 H420" stroke="#93c5fd" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M650 365 H730" stroke="#93c5fd" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M960 365 H1040" stroke="#93c5fd" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1270 420 C1390 450 1410 480 1380 510" stroke="#93c5fd" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1280 650 C950 790 470 760 210 450" stroke="#93c5fd" stroke-width="5" fill="none" stroke-dasharray="12 16" marker-end="url(#arrow)" opacity="0.85"/>
  <g font-family="Inter, Apple SD Gothic Neo, sans-serif">
    <rect x="190" y="585" width="770" height="105" rx="24" fill="#0f172a" opacity="0.76" stroke="#334155"/>
    <text x="230" y="635" fill="#e5e7eb" font-size="28" font-weight="700">훈련장은 모델이 무엇을 배울 수 있는지를 정한다</text>
    <text x="230" y="672" fill="#cbd5e1" font-size="21">task distribution · tool access · reward signal · persistent state</text>
  </g>
</svg>
