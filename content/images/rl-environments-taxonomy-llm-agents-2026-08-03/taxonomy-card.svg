<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <text x="90" y="120" fill="#bfdbfe" font-size="36" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-weight="700">RL Environment Taxonomy</text>
  <text x="90" y="205" fill="#f8fafc" font-size="68" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-weight="900">E = {T, H, V, S, C}</text>
  <g font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="34">
    <rect x="90" y="305" width="1020" height="120" rx="28" fill="#f8fafc" opacity="0.95"/><text x="140" y="380" fill="#0f172a" font-weight="800">T · Tasks</text><text x="430" y="380" fill="#334155">무엇을 풀게 할 것인가</text>
    <rect x="90" y="455" width="1020" height="120" rx="28" fill="#f8fafc" opacity="0.95"/><text x="140" y="530" fill="#0f172a" font-weight="800">H · Harness</text><text x="430" y="530" fill="#334155">어떻게 행동하게 할 것인가</text>
    <rect x="90" y="605" width="1020" height="120" rx="28" fill="#f8fafc" opacity="0.95"/><text x="140" y="680" fill="#0f172a" font-weight="800">V · Verifier</text><text x="430" y="680" fill="#334155">무엇을 좋은 결과로 볼 것인가</text>
    <rect x="90" y="755" width="1020" height="120" rx="28" fill="#f8fafc" opacity="0.95"/><text x="140" y="830" fill="#0f172a" font-weight="800">S · State</text><text x="430" y="830" fill="#334155">무엇을 기억하고 유지할 것인가</text>
    <rect x="90" y="905" width="1020" height="120" rx="28" fill="#f8fafc" opacity="0.95"/><text x="140" y="980" fill="#0f172a" font-weight="800">C · Config</text><text x="430" y="980" fill="#334155">한계와 curriculum을 어떻게 둘 것인가</text>
  </g>
  <text x="90" y="1110" fill="#cbd5e1" font-size="30" font-family="Inter, Apple SD Gothic Neo, sans-serif">모델보다 훈련장이 에이전트의 행동을 만든다</text>
</svg>
